name: Docker Build and Push to Docker Hub

on:
  push:
    branches: [ docker-deploy ]

jobs:
  build-jar:
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.4-eclipse-temurin-17

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build with Maven (tests + package)
        run: mvn -B package

      - name: Locate artifact and copy as app.jar
        run: |
          JAR=$(ls target/*.jar | grep -v 'original' | head -n 1)
          echo "Found JAR: $JAR"
          cp "$JAR" "$GITHUB_WORKSPACE/app.jar"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: app.jar

  docker-build-push:
    needs: build-jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Checar secrets Docker Hub (debug)
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then echo "ERRO: DOCKERHUB_USERNAME está vazio"; exit 1; fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then echo "ERRO: DOCKERHUB_TOKEN está vazio"; exit 1; fi

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/springboot-mpb:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/springboot-mpb:${{ github.sha }}
