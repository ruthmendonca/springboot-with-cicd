name: Docker Build and Push to Docker Hub

on:
  push:
    branches: [ docker-deploy ]

jobs:
  build-jar:
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.4-eclipse-temurin-17

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build with Maven (tests + package)
        run: mvn -B package

      - name: Locate artifact and copy as app.jar
        run: |
          JAR=$(ls target/*.jar | grep -v 'original' | head -n 1)
          echo "Found JAR: $JAR"
          cp "$JAR" "$GITHUB_WORKSPACE/app.jar"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: app.jar

  ker-push:
    needs: build-jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Download do Artefato
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/springboot-mpb:latest
            ${{ secrets.DOCKER_USERNAME }}/springboot-mpb:${{ github.sha }}
